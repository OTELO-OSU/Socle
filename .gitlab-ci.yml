stages:
  - test

image: composer:2

services:
  - name: postgres:16-alpine
    alias: database
    variables:
      POSTGRES_DB: poe_test
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root

variables:
  APP_ENV: test
  DATABASE_URL: "postgresql://root:root@database:5432/poe_test?serverVersion=16&charset=utf8"
  MAILER_DSN: "null://null"
  FRONT_HOST: "http://localhost"
  NOREPLY_EMAIL: "noreply@ul.fr"

test:
  stage: test
  before_script:
    - apk add --no-cache postgresql-dev icu-dev libzip-dev unzip git
    - docker-php-ext-install pdo pdo_pgsql intl zip
    - cd backend
    - composer install --no-interaction --prefer-dist --no-progress
  script:
    - php bin/console lexik:jwt:generate-keypair --overwrite
    - php bin/console doctrine:database:create --if-not-exists --env=test
    - php bin/console doctrine:schema:drop --force --full-database --env=test || true
    - php bin/console doctrine:schema:create --env=test
    - php bin/phpunit --log-junit report.xml
  artifacts:
    when: always
    reports:
      junit: backend/report.xml
