services:
  central:
    image: nginx:alpine
    ports:
      - "125:80"
    volumes:
      - ./docker/central/conf.d:/etc/nginx/conf.d:ro
      - ./docker/central/html:/usr/share/nginx/html:ro

  mailer:
    image: axllent/mailpit
    ports:
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy

  database:
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: poe
      POSTGRES_PASSWORD: poe
      POSTGRES_USER: poe

  php:
    build:
      context: .
      dockerfile: ./docker/php-fpm/dockerfile
      args:
        - APP_ENV=dev
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql://poe:poe@database:5432/poe?serverVersion=16&charset=utf8
      MAILER_DSN: smtp://mailer:1025
      NOREPLY_EMAIL: noreply@ul.fr
      CENTRAL_TAG: http://central
      JWT_PASSPHRASE: passphrase
      TRUSTED_PROXIES: localhost
      CORS_ALLOW_ORIGIN: http://localhost:3000
      # Fausse env normalement c'est déjà dans l'image
      APP_VERSION: 0.0.0
    volumes:
      - ./backend:/var/www/backend:rw
    depends_on:
      database:
        condition: service_healthy

  frontend:
    image: node:22
    working_dir: /frontend
    volumes:
      - ./frontend:/frontend
    command: sh -c "npm install && exec npm run dev -- --host 0.0.0.0"
    ports:
      - "5173"
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:3000/api
      VITE_FRONT_URL: http://localhost:3000

  nginx:
    build:
      context: .
      dockerfile: ./docker/nginx/dockerfile
    volumes:
      - ./docker/nginx/conf.d.dev:/etc/nginx/conf.d:ro
      - ./backend:/var/www/backend:ro
    depends_on:
      - php
      - frontend

  workspace:
    build:
      context: .
      dockerfile: .devcontainer/dockerfile
    volumes:
      - .:/workspace
    command: sleep infinity