server {
    listen 80;
    server_name localhost;

    root /var/www/frontend;
    index index.html;

    location /api/connexionFede {
        # Neutralisation de tentative d'injection de headers HTTP dans la requête vers /api/connexionFede
        fastcgi_param HTTP_MAIL "";
        fastcgi_param HTTP_GIVENNAME "";
        fastcgi_param HTTP_SN "";

        return 403;
    }

    location = /loginCAS {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;

        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_param REQUEST_URI /api/connexionFede;
    }

    # Route API -> Symfony
    location /api {
        try_files $uri /index.php$is_args$args;
    }

    # Frontend SPA
    location / {
        try_files $uri /index.html;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;

        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}