services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./backend:/var/www/backend:ro
    depends_on:
      - php

  php:
    build:
      context: .
      dockerfile: ./docker/php-fpm/dockerfile
    environment:
      DATABASE_URL: postgresql://root:root@database:5432/poe?serverVersion=16&charset=utf8
      MAILER_DSN: smtp://mailer:1025
      NOREPLY_EMAIL: noreply@ul.fr
    volumes:
      - ./backend:/var/www/backend:rw
    depends_on:
      - database

  ###> doctrine/doctrine-bundle ###
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: poe
      POSTGRES_PASSWORD: root
      POSTGRES_USER: root
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "poe", "-U", "root"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - ./docker/volumes/database:/var/lib/postgresql/data:rw
  ###< doctrine/doctrine-bundle ###

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy

  ###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
  ###< symfony/mailer ###

networks:
  default:
    driver: bridge
