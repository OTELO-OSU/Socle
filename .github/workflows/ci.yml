name: Tests backend

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    needs:
      - audit-frontend
      - audit-backend
    container: composer:2
    services:
      database:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: poe_test
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
        options: >-
          --health-cmd "pg_isready -U root -d poe_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      DATABASE_URL: "postgresql://root:root@database:5432/poe_test?serverVersion=16&charset=utf8"
      MAILER_DSN: "null://null"
      FRONT_HOST: "http://localhost"
      NOREPLY_EMAIL: "noreply@ul.fr"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Installer les extensions PHP
        run: |
          apk add --no-cache postgresql-dev icu-dev libzip-dev unzip git freetype-dev libjpeg-turbo-dev libpng-dev
          docker-php-ext-configure gd --with-freetype --with-jpeg
          docker-php-ext-install gd pdo pdo_pgsql intl zip

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Préparer la base de données
        run: |
          php bin/console lexik:jwt:generate-keypair --overwrite
          php bin/console doctrine:database:create --if-not-exists --env=test
          php bin/console doctrine:schema:drop --force --full-database --env=test || true
          php bin/console doctrine:schema:create --env=test

      - name: Exécuter les tests
        run: php bin/phpunit --log-junit report.xml

      - name: Conserver le rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-backend
          path: backend/report.xml
          if-no-files-found: warn


  audit-frontend:
    runs-on: ubuntu-latest
    container: node:24-alpine

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les dépendances pour les vulnérabilités
        run: npm audit --audit-level=high

  audit-backend:
    runs-on: ubuntu-latest
    container: composer:2

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Autoriser le répertoire du dépôt pour Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Vérifier les dépendances pour les vulnérabilités
        run: composer audit --locked
          --ignore-severity=low
          --ignore-severity=medium
          --abandoned=report


  deploy:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Récupérer le code testé
        uses: actions/checkout@v4

      - name: Préparer les noms des images
        id: image
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          echo "base=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Se connecter à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier nginx
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx/dockerfile
          push: true
          tags: ${{ steps.image.outputs.base }}/nginx:${{ steps.image.outputs.version }}

      - name: Construire et publier PHP
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php-fpm/dockerfile
          push: true
          build-args: APP_ENV=prod
          tags: ${{ steps.image.outputs.base }}/php:${{ steps.image.outputs.version }}
