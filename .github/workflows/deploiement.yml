name: Déploiement

on:
  workflow_run:
    workflows: ["Tests backend"]
    types: [completed]

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')

    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code testé
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Préparer les noms des images
        id: image
        env:
          VERSION: ${{ github.event.workflow_run.head_branch }}
        run: |
          echo "base=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Se connecter à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier nginx
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx/dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.base }}/nginx:${{ steps.image.outputs.version }}

      - name: Construire et publier PHP
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php-fpm/dockerfile
          push: true
          build-args: |
            APP_ENV=prod
            APP_VERSION=${{ steps.image.outputs.version }}
          tags: |
            ${{ steps.image.outputs.base }}/php:${{ steps.image.outputs.version }}