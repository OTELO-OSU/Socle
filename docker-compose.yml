services:
  nginx:
    image: ghcr.io/otelo-osu/socle/nginx:${APP_VERSION:-1.0.0}
    environment:
      - API_URL=${API_URL}
      - FRONT_URL=${FRONT_HOST}
    ports:
      - ${NGINX_PORT}:80
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./backend:/var/www/backend:ro
    depends_on:
      php:
        condition: service_started

  php:
    image: ghcr.io/otelo-osu/socle/php:${APP_VERSION:-1.0.0}
    environment:
      APP_ENV: ${APP_ENV}
      APP_SECRET: ${APP_SECRET}
      FRONT_HOST: ${FRONT_HOST}
      DATABASE_URL: ${DATABASE_URL}
      MAILER_DSN: ${MAILER_DSN}
      NOREPLY_EMAIL: ${NOREPLY_EMAIL}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      CENTRAL_TAG: https://socle-tags.otelo.univ-lorraine.fr
      TRUSTED_PROXIES: ${TRUSTED_PROXIES}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN}
    depends_on:
      - database

  ###> doctrine/doctrine-bundle ###
  database:
    image: postgres:16-alpine
    ports:  
      - ${POSTGRES_PORT}:5432
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "poe", "-U", "root"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data
  ###< doctrine/doctrine-bundle ###

networks:
  default:
    driver: bridge

volumes:
  database_data: